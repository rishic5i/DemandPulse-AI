name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          AI_PROVIDER: groq
          GROQ_MODEL: openai/gpt-oss-20b

  security:
    name: Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit (high+)
        run: pnpm security:audit

      - name: Install Gitleaks CLI
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz" \
            | tar -xz -C /tmp
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Secret scan (Gitleaks)
        run: gitleaks detect --source . --verbose --redact --exit-code 1

      - name: Guard against public secret env patterns
        run: |
          set -euo pipefail
          if git grep -nE 'GROQ_API_KEY\s*=\s*gsk_|NEXT_PUBLIC_GROQ|AKIA[0-9A-Z]{16}' -- \
            ':!.github/workflows/**' \
            ':!docs/**' \
            ':!AGENTS.md' \
            ':!README.md' \
            ':!docs/agents/**' \
            ':!.env.example'; then
            echo "Potential secret material detected in tracked files"
            exit 1
          fi
          echo "No obvious secret patterns found in tracked source"
